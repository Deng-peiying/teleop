[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji-hand2-teleop"
version = "0.2.0"
description = "Wuji Glove to Wuji Hand2 left simulation with thumb_track_b4"
requires-python = ">=3.12"
dependencies = ["wuji-sdk==2026.10.26", "pin==4.1.0", "nlopt==2.11.0", "mujoco==3.16.0", "numpy==2.5.4", "scipy==1.18.1"]

[project.scripts]
hand2-teleop = "teleop.hand2_live:main"
teleop-arm = "teleop.mujoco_control:arm_main"

[project.optional-dependencies]
arm = ["Robotic_Arm==1.1.7"]

[tool.setuptools.packages.find]
where = ["src"]
